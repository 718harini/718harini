<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Learn, Build, Test, Troubleshoot, Improve loop">
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#A78BFA"/>
    </marker>
  </defs>
  <style>
    .loop { stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -14; } }
  </style>

  <rect width="900" height="300" rx="18" fill="#0D1117" stroke="#24164A" stroke-width="2"/>
  <text x="26" y="36" font-family="'Courier New',monospace" font-size="13" fill="#64748b">ci/cd pipeline  ·  my learning loop</text>
  <circle cx="868" cy="32" r="5" fill="#4ade80">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- connectors -->
  <g stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M175 115H218"/>
    <path d="M350 115H393"/>
    <path d="M525 115H568"/>
    <path d="M700 115H743"/>
  </g>

  <!-- stage boxes -->
  <g font-family="'Segoe UI',Arial,sans-serif" text-anchor="middle">
    <g>
      <rect x="45" y="80" width="130" height="70" rx="12" fill="#131a33" stroke="#2d3a6b" stroke-width="2"/>
      <rect x="45" y="80" width="130" height="70" rx="12" fill="#38BDF8" fill-opacity="0.16" stroke="#38BDF8" stroke-width="3" opacity="0">
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0;0.1;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="110" y="103" font-size="11" fill="#64748b" font-family="'Courier New',monospace">01</text>
      <text x="110" y="128" font-size="16" font-weight="700" fill="#e2e8f0">Learn</text>
      <text x="110" y="174" font-size="11" fill="#94a3b8">AWS · Terraform · Python</text>
    </g>
    <g>
      <rect x="220" y="80" width="130" height="70" rx="12" fill="#131a33" stroke="#2d3a6b" stroke-width="2"/>
      <rect x="220" y="80" width="130" height="70" rx="12" fill="#38BDF8" fill-opacity="0.16" stroke="#38BDF8" stroke-width="3" opacity="0">
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.125;0.225;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="285" y="103" font-size="11" fill="#64748b" font-family="'Courier New',monospace">02</text>
      <text x="285" y="128" font-size="16" font-weight="700" fill="#e2e8f0">Build</text>
      <text x="285" y="174" font-size="11" fill="#94a3b8">IaC · Boto3 · CI/CD</text>
    </g>
    <g>
      <rect x="395" y="80" width="130" height="70" rx="12" fill="#131a33" stroke="#2d3a6b" stroke-width="2"/>
      <rect x="395" y="80" width="130" height="70" rx="12" fill="#38BDF8" fill-opacity="0.16" stroke="#38BDF8" stroke-width="3" opacity="0">
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.25;0.35;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="460" y="103" font-size="11" fill="#64748b" font-family="'Courier New',monospace">03</text>
      <text x="460" y="128" font-size="16" font-weight="700" fill="#e2e8f0">Test</text>
      <text x="460" y="174" font-size="11" fill="#94a3b8">Plan · Validate · Verify</text>
    </g>
    <g>
      <rect x="570" y="80" width="130" height="70" rx="12" fill="#131a33" stroke="#2d3a6b" stroke-width="2"/>
      <rect x="570" y="80" width="130" height="70" rx="12" fill="#38BDF8" fill-opacity="0.16" stroke="#38BDF8" stroke-width="3" opacity="0">
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.375;0.475;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="635" y="103" font-size="11" fill="#64748b" font-family="'Courier New',monospace">04</text>
      <text x="635" y="128" font-size="14" font-weight="700" fill="#e2e8f0">Troubleshoot</text>
      <text x="635" y="174" font-size="11" fill="#94a3b8">Logs · Metrics · Root cause</text>
    </g>
    <g>
      <rect x="745" y="80" width="130" height="70" rx="12" fill="#131a33" stroke="#2d3a6b" stroke-width="2"/>
      <rect x="745" y="80" width="130" height="70" rx="12" fill="#38BDF8" fill-opacity="0.16" stroke="#38BDF8" stroke-width="3" opacity="0">
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.5;0.6;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="810" y="103" font-size="11" fill="#64748b" font-family="'Courier New',monospace">05</text>
      <text x="810" y="128" font-size="16" font-weight="700" fill="#e2e8f0">Improve</text>
      <text x="810" y="174" font-size="11" fill="#94a3b8">Optimize · Automate · Repeat</text>
    </g>
  </g>

  <!-- return loop -->
  <path class="loop" d="M810 190C810 280 110 280 110 190" fill="none" stroke="#A78BFA" stroke-width="2" marker-end="url(#arrowP)"/>
  <text x="460" y="268" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" fill="#A78BFA">next iteration</text>

  <!-- packet: forward -->
  <circle r="6" fill="#38BDF8" filter="url(#glow)" opacity="0">
    <animateMotion dur="8s" repeatCount="indefinite" path="M110 115H810" keyPoints="0;1;1" keyTimes="0;0.5;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.5;0.52;1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- packet: loop back -->
  <circle r="6" fill="#A78BFA" filter="url(#glow)" opacity="0">
    <animateMotion dur="8s" repeatCount="indefinite" path="M810 190C810 280 110 280 110 190" keyPoints="0;0;1;1" keyTimes="0;0.5;0.95;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.51;0.95;0.97;1" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>
